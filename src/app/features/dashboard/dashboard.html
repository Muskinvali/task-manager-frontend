<main class="dashboard-page">
  <header class="dashboard-header">
    <div class="brand">
      <div class="brand-mark">TM</div>
      <div>
        <p class="eyebrow">Workspace</p>
        <h1>Task Manager</h1>
      </div>
    </div>

    <div class="user-actions">
      <button class="tasks-button" type="button" (click)="openTasks()">
        View tasks
      </button>
      <div class="user-copy">
        <span class="user-label">Welcome back</span>
        <strong>Muskin</strong>
      </div>
      <button class="logout-button" type="button" (click)="logout()">
        <span aria-hidden="true">↪</span>
        Logout
      </button>
    </div>
  </header>

  <section class="welcome-section">
    <p class="eyebrow">Overview</p>
    <h2>Good to see you, Muskin</h2>
    <p>Here is a quick look at your task progress.</p>
  </section>

  <section class="summary-grid" aria-label="Task summary">
    <article class="summary-card summary-card-primary">
      <div class="card-icon">✓</div>
      <div>
        <p>Total Tasks</p>
        <strong>25</strong>
      </div>
      <span class="card-note">All tasks</span>
    </article>

    <article class="summary-card summary-card-warning">
      <div class="card-icon">◷</div>
      <div>
        <p>Pending</p>
        <strong>10</strong>
      </div>
      <span class="card-note">Needs attention</span>
    </article>

    <article class="summary-card summary-card-success">
      <div class="card-icon">★</div>
      <div>
        <p>Completed</p>
        <strong>15</strong>
      </div>
      <span class="card-note">Great progress</span>
    </article>
  </section>
</main>
